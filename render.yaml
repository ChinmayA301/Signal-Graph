# Render blueprint for the SignalGraph API.
#
# The API is deployed as a container rather than as serverless functions
# because it depends on the local `packages/scoring` package, which lives
# outside apps/api. The Dockerfile copies and installs it; a serverless
# Python runtime rooted at apps/api could not see it.
#
# Railway and Fly.io deploy the same Dockerfile with their own config.
services:
  - type: web
    name: signalgraph-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Mock mode needs no secrets at all — the demo works out of the box.
      - key: MOCK_MODE
        value: "true"
      # Set to the deployed frontend origin, or the browser blocks every call.
      - key: CORS_ALLOW_ORIGINS
        value: http://localhost:3000
      # GITHUB_TOKEN is deliberately NOT declared here. Listing it with
      # `sync: false` makes Render prompt for it during blueprint creation,
      # which implies it is required — it is not. Mock mode needs no
      # credentials. To enable live ingestion later, add GITHUB_TOKEN in the
      # Render dashboard and set MOCK_MODE=false; it must be a classic PAT
      # with public_repo scope (see DEPLOYMENT.md for why).
    # No DATABASE_URL: the app falls back to SQLite and creates its own
    # tables at startup. The disk is ephemeral, so analyses reset on redeploy
    # — fine for a demo. Add a Postgres URL for durable storage.
